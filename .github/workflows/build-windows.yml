# Builds RemoteDesk-Setup.exe on a real Windows machine.
# Push to GitHub -> Actions tab -> download "RemoteDesk-Windows".
# Push a tag like v1.0.0 -> a Release with the installer is published.
name: Build RemoteDesk (Windows + Android)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Stamp version
        shell: pwsh
        run: Set-Content version.py 'VERSION = "1.0.${{ github.run_number }}"'

      - name: Build RemoteDesk.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name RemoteDesk --icon icon.ico
          --hidden-import win32timezone --hidden-import servicemanager
          --hidden-import win32serviceutil --hidden-import win32ts --hidden-import win32profile
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          app.py

      - name: Smoke test (imports inside the exe)
        shell: pwsh
        run: |
          python -c "import core, winsvc, tkinter, mss, pynput, win32serviceutil; print('imports ok')"
          if (!(Test-Path dist\RemoteDesk.exe)) { exit 1 }

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          $env:APP_VERSION = $env:APP_VERSION.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\RemoteDesk.iss

      - name: System service test (install, connect, capture, uninstall)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r ..\server\requirements.txt
          $relay = Start-Process python -ArgumentList "..\server\relay.py" -PassThru -WindowStyle Hidden
          Start-Sleep 3
          python tests\ci_service_test.py dist\RemoteDesk.exe test-output
          $code = $LASTEXITCODE
          Stop-Process $relay.Id -ErrorAction SilentlyContinue
          exit $code

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-output
          path: client/test-output

      - name: Checksum for auto-update
        shell: pwsh
        run: (Get-FileHash dist\RemoteDesk.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline dist\RemoteDesk.exe.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: RemoteDesk-Windows
          path: |
            client/dist/RemoteDesk-Setup.exe
            client/dist/RemoteDesk.exe
            client/dist/RemoteDesk.exe.sha256

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key (from repository secret, if configured)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing with the release key"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set - APK is signed with a temporary key (updates will need uninstall/reinstall)"
          fi

      - name: Unit tests (crypto must match the PC version byte-for-byte)
        run: gradle --no-daemon testReleaseUnitTest

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/RemoteDesk-Android.apk

      - uses: actions/upload-artifact@v5
        with:
          name: RemoteDesk-Android
          path: dist/RemoteDesk-Android.apk

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Publish release (permanent download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RemoteDesk 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            ## הורדה
            * **RemoteDesk-Setup.exe** - תוכנה למחשב Windows (מומלץ). מריצים, מאשרים, ומסמנים "התקן כשירות מערכת".
            * **RemoteDesk-Android.apk** - אפליקציה לטלפון אנדרואיד, כדי שאפשר יהיה לשלוט בטלפון מרחוק.
            * **RemoteDesk.exe** - גרסה ניידת למחשב, בלי התקנה.

            לשליטה **מהטלפון** במחשב לא צריך להתקין כלום: פותחים בדפדפן את https://remotedesk-relay-tdfv.onrender.com

            נבדק אוטומטית: התקנת שירות Windows, חיבור, צילום מסך, שליטה בעכבר, הסרה; הצפנה זהה בין המחשב לטלפון.
          files: |
            out/RemoteDesk-Setup.exe
            out/RemoteDesk.exe
            out/RemoteDesk.exe.sha256
            out/RemoteDesk-Android.apk
